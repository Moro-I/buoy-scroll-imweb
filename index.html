<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>친환경 부표 인터랙션</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #ffffff; /* 배경 흰색 */
            overflow-x: hidden;
        }

        /* 실제 스크롤 길이를 만드는 컨테이너 */
        .scroll-container {
            height: 700vh;
        }

        /* 애니메이션 구간에서만 보이는 고정 캔버스 */
        canvas#buoy-canvas {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            pointer-events: none;
            z-index: 9998;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
    </style>
</head>
<body>
    <div class="scroll-container"></div>
    <canvas id="buoy-canvas"></canvas>

    <script>
        const frameCount = 264;
        const BASE_URL = './frames_webp/';

        const scrollContainer = document.querySelector('.scroll-container');
        const canvas = document.getElementById('buoy-canvas');
        const context = canvas.getContext('2d');
        const images = [];

        const currentFrame = (index) =>
            `${BASE_URL}frame_${index.toString().padStart(4, '0')}.webp`;

        for (let i = 1; i <= frameCount; i++) {
            const img = new Image();
            img.src = currentFrame(i);
            if (i === 1) img.onload = () => updateImage(1);
            images.push(img);
        }

        function getScrollState() {
            const rect = scrollContainer.getBoundingClientRect();
            const viewportHeight = window.innerHeight;
            const maxProgressDistance = Math.max(
                1,
                scrollContainer.offsetHeight - viewportHeight
            );
            const progressed = Math.min(
                maxProgressDistance,
                Math.max(0, -rect.top)
            );
            const progress = progressed / maxProgressDistance;

            return {
                progress,
                isPinned: rect.top <= 0 && rect.bottom >= viewportHeight,
                isBefore: rect.top > 0,
                isAfter: rect.bottom < viewportHeight
            };
        }

        function setCanvasVisibility(isVisible) {
            canvas.style.opacity = isVisible ? '1' : '0';
        }

        function renderByScroll() {
            const state = getScrollState();
            const frameIndex = Math.min(
                frameCount - 1,
                Math.floor(state.progress * frameCount)
            );

            if (state.isBefore) {
                setCanvasVisibility(false);
                updateImage(1);
                return;
            }

            if (state.isAfter) {
                setCanvasVisibility(false);
                updateImage(frameCount);
                return;
            }

            setCanvasVisibility(state.isPinned);
            updateImage(frameIndex + 1);
        }

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            renderByScroll();
        }

        window.addEventListener('scroll', () => {
            requestAnimationFrame(renderByScroll);
        }, { passive: true });
        window.addEventListener('resize', initCanvas);
        window.addEventListener('load', initCanvas);

        function updateImage(index) {
            const img = images[index - 1];
            if (!img || !img.complete) return;

            context.clearRect(0, 0, canvas.width, canvas.height);

            const imgAspect = img.width / img.height;
            const canvasAspect = canvas.width / canvas.height;
            const margin = 0.85;

            let drawWidth, drawHeight;

            if (canvasAspect > imgAspect) {
                drawHeight = canvas.height * margin;
                drawWidth = drawHeight * imgAspect;
            } else {
                drawWidth = canvas.width * margin;
                drawHeight = drawWidth / imgAspect;
            }

            const drawX = (canvas.width - drawWidth) / 2;
            const drawY = (canvas.height - drawHeight) / 2;

            context.drawImage(img, drawX, drawY, drawWidth, drawHeight);
        }

        initCanvas();
    </script>
</body>
</html>
